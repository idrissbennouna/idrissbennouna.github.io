<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Idriss | AI & Data Engineer</title>
<meta name="description" content="Portfolio d'Idriss, étudiant ingénieur en IA & Data.">
<meta name="theme-color" content="#05060f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05060f;
  --text:#e8ecff;
  --muted:#8a91b4;
  --blue:#4f8cff;
  --violet:#9b5cff;
  --cyan:#3de6ff;
  --glass:rgba(255,255,255,.05);
  --glass-border:rgba(255,255,255,.12);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:'Space Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}

#bg{position:fixed;inset:0;z-index:0}
.glow{position:fixed;width:520px;height:520px;border-radius:50%;pointer-events:none;z-index:1;
  background:radial-gradient(circle,rgba(79,140,255,.22),rgba(155,92,255,.10) 45%,transparent 70%);
  transform:translate(-50%,-50%);left:50%;top:50%;transition:opacity .4s}

/* NAV */
header{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;
  justify-content:space-between;padding:20px clamp(16px,4vw,48px)}
.logo{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--muted);letter-spacing:.04em}
.logo b{color:var(--cyan);font-weight:500}
nav{display:flex;gap:4px;padding:5px;border-radius:999px;background:var(--glass);
  border:1px solid var(--glass-border);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
nav button{position:relative;border:0;background:none;color:var(--muted);cursor:pointer;
  font:500 13px 'Space Grotesk',sans-serif;padding:9px 16px;border-radius:999px;transition:color .3s}
nav button:hover{color:var(--text)}
nav button.active{color:#fff}
nav .pill{position:absolute;top:5px;bottom:5px;left:0;border-radius:999px;z-index:-1;
  background:linear-gradient(135deg,rgba(79,140,255,.55),rgba(155,92,255,.55));
  box-shadow:0 0 24px rgba(99,102,255,.45);transition:transform .6s var(--ease),width .6s var(--ease)}
nav{isolation:isolate}

/* PAGES */
main{position:fixed;inset:0;z-index:5}
.page{position:absolute;inset:0;display:flex;flex-direction:column;
  padding:110px clamp(20px,8vw,120px) 90px;opacity:0;visibility:hidden;pointer-events:none;
  transform:translateX(calc(var(--dir,1)*80px)) scale(.97);filter:blur(14px);
  transition:opacity .7s var(--ease),transform .9s var(--ease),filter .7s var(--ease),visibility 0s .9s;
  overflow-y:auto}
.page.active{opacity:1;visibility:visible;pointer-events:auto;transform:none;filter:none;
  transition:opacity .7s var(--ease) .15s,transform .9s var(--ease) .15s,filter .7s var(--ease) .15s,visibility 0s}
.page.leaving{transform:translateX(calc(var(--dir,1)*-80px)) scale(.97)}

.reveal{opacity:0;transform:translateY(26px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.page.active .reveal{opacity:1;transform:none;transition-delay:calc(.35s + var(--i,0)*.09s)}

/* TYPO */
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--cyan);letter-spacing:.14em;text-transform:uppercase}
h1{font-size:clamp(44px,9vw,104px);line-height:1;font-weight:700;letter-spacing:-.03em;margin:14px 0 18px}
h2{font-size:clamp(32px,5.5vw,60px);font-weight:700;letter-spacing:-.02em;margin:10px 0 18px}
.grad{background:linear-gradient(120deg,var(--blue),var(--violet) 55%,var(--cyan));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.lead{max-width:620px;color:var(--muted);font-size:clamp(16px,2vw,20px);line-height:1.6}
.card{margin-top:26px;max-width:620px;padding:22px 24px;border-radius:20px;background:var(--glass);
  border:1px solid var(--glass-border);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  color:var(--muted);line-height:1.6}
.card code{font-family:'JetBrains Mono',monospace;color:var(--cyan);font-size:13px}
.hint{display:inline-flex;align-items:center;gap:10px;margin-top:34px;color:var(--muted);
  font-family:'JetBrains Mono',monospace;font-size:12px}
.hint kbd{border:1px solid var(--glass-border);border-radius:6px;padding:3px 8px;background:var(--glass)}

/* WIPE */
.wipe{position:fixed;inset:0;z-index:8;pointer-events:none;transform:translateX(-101%);
  background:linear-gradient(100deg,transparent 0%,rgba(79,140,255,.16) 40%,rgba(155,92,255,.22) 60%,transparent 100%)}
.wipe.run{animation:wipe .9s var(--ease)}
.wipe.back{animation:wipeb .9s var(--ease)}
@keyframes wipe{0%{transform:translateX(-101%)}100%{transform:translateX(101%)}}
@keyframes wipeb{0%{transform:translateX(101%)}100%{transform:translateX(-101%)}}

/* PROGRESS */
.dots{position:fixed;z-index:10;right:clamp(14px,3vw,36px);top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:12px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--glass-border);cursor:pointer;
  transition:all .5s var(--ease)}
.dots i.active{height:28px;border-radius:8px;background:linear-gradient(var(--blue),var(--violet));
  box-shadow:0 0 14px rgba(99,102,255,.7)}
.counter{position:fixed;z-index:10;left:clamp(16px,4vw,48px);bottom:24px;
  font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted)}
.counter b{color:var(--text);font-weight:500}

.page::before,.page::after{content:'';flex:1 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px;margin-top:26px;max-width:1120px;align-items:start}
.proj{--acc:155,123,255;position:relative;padding:22px;border-radius:20px;background:var(--glass);
  border:1px solid var(--glass-border);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  cursor:pointer;outline:none;transition:transform .5s var(--ease),border-color .4s,box-shadow .4s}
.proj:hover,.proj:focus-visible,.proj.open{transform:translateY(-4px);border-color:rgba(var(--acc),.6);box-shadow:0 0 30px rgba(var(--acc),.22)}
.ptag{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgb(var(--acc))}
.proj h3{font-size:24px;font-weight:700;letter-spacing:-.01em;margin:8px 0}
.pdesc{color:var(--muted);line-height:1.55;font-size:15px}
.pmore{list-style:none;margin:0;max-height:0;overflow:hidden;opacity:0;transition:max-height .7s var(--ease),opacity .4s,margin .4s}
.proj.open .pmore{max-height:700px;opacity:1;margin:14px 0 4px}
.pmore li{position:relative;padding-left:16px;margin-bottom:9px;font-size:14px;line-height:1.55;color:var(--muted)}
.pmore li::before{content:'';position:absolute;left:0;top:.6em;width:6px;height:6px;border-radius:50%;background:rgb(var(--acc))}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chips span{font-family:'JetBrains Mono',monospace;font-size:11px;padding:4px 9px;border-radius:999px;
  border:1px solid rgba(var(--acc),.35);color:var(--text);background:rgba(var(--acc),.08)}
.pfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px}
.ptoggle,.plink{font-family:'JetBrains Mono',monospace;font-size:12px;color:rgb(var(--acc))}
.plink{text-decoration:none;padding:5px 10px;border-radius:999px;border:1px solid rgba(var(--acc),.4);transition:background .3s}
.plink:hover,.plink:focus-visible{background:rgba(var(--acc),.18);outline:none}
.sg{--acc:155,123,255;padding:20px;border-radius:20px;background:var(--glass);border:1px solid var(--glass-border);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:border-color .4s,box-shadow .4s}
.sg:hover{border-color:rgba(var(--acc),.5);box-shadow:0 0 26px rgba(var(--acc),.18)}
.sg .chips{margin-top:12px}
.chips span{transition:transform .3s var(--ease),background .3s}
.sg .chips span{font-size:12.5px;padding:6px 12px}
.sg .chips span:hover{transform:translateY(-2px);background:rgba(var(--acc),.22)}
.page.active .sg .chip{animation:chipin .6s var(--ease) backwards;animation-delay:calc(.55s + var(--j)*30ms)}
@keyframes chipin{from{opacity:0;transform:translateY(10px) scale(.9)}}
@media (min-width:900px){.grid>.wide{grid-column:span 2}}
.chead{display:flex;align-items:center;gap:18px;margin:10px 0 6px}
.chead h2{margin:0}
.crow{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.status{display:inline-flex;align-items:center;gap:10px;padding:7px 14px;border-radius:999px;
  border:1px solid rgba(61,230,196,.35);background:rgba(61,230,196,.08);
  font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text)}
.status i{width:8px;height:8px;border-radius:50%;background:#3de6c4;box-shadow:0 0 10px #3de6c4;animation:pulse 2s infinite}
.status.edu{border-color:var(--glass-border);background:var(--glass)}
@keyframes pulse{50%{opacity:.35}}
.clinks{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:24px;max-width:920px}
.clink{--acc:155,123,255;display:flex;align-items:center;gap:6px;border-radius:18px;background:var(--glass);
  border:1px solid var(--glass-border);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transition:transform .5s var(--ease),border-color .4s,box-shadow .4s}
.clink:hover,.clink:focus-within{transform:translateY(-3px);border-color:rgba(var(--acc),.6);box-shadow:0 0 28px rgba(var(--acc),.22)}
.cmain{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:16px 18px;color:var(--text);text-decoration:none;outline:none}
.cmain svg{width:24px;height:24px;flex:none;stroke:rgb(var(--acc));fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ct{flex:1;min-width:0}
.ct span{display:block}
.cl{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgb(var(--acc))}
.cv{font-size:14px;margin-top:3px;overflow-wrap:anywhere}
.go{color:var(--muted);font-size:16px}
.copy{margin-right:14px;border:1px solid var(--glass-border);background:var(--glass);color:var(--text);cursor:pointer;
  font:500 11px 'JetBrains Mono',monospace;padding:7px 11px;border-radius:999px;transition:background .3s,border-color .3s}
.copy:hover,.copy:focus-visible{background:rgba(var(--acc),.2);border-color:rgba(var(--acc),.6);outline:none}
.hero{font-size:clamp(34px,6vw,72px);line-height:1.05;max-width:15em;margin:14px 0 18px}
.about{margin-top:22px;max-width:620px;padding:18px 22px;border-radius:20px;background:var(--glass);
  border:1px solid var(--glass-border);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  color:var(--muted);line-height:1.65;font-size:15px}
.about .tag{display:block;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--cyan);margin-bottom:8px}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.btn{border:1px solid var(--glass-border);background:var(--glass);color:var(--text);cursor:pointer;
  font:500 14px 'Space Grotesk',sans-serif;padding:12px 22px;border-radius:999px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transition:transform .3s var(--ease),border-color .3s,box-shadow .3s}
.btn:hover{transform:translateY(-2px);border-color:rgba(155,123,255,.6);box-shadow:0 0 22px rgba(99,102,255,.35)}
.btn.primary{background:linear-gradient(135deg,rgba(79,140,255,.6),rgba(155,92,255,.6));border-color:transparent}
.lang{display:flex;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-border);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.lang button{border:0;background:none;color:var(--muted);cursor:pointer;font:500 12px 'JetBrains Mono',monospace;
  padding:7px 11px;border-radius:999px;transition:color .3s,background .3s}
.lang button.on{color:#fff;background:rgba(155,92,255,.45)}

@media (max-width:640px){
  .lang{position:absolute;top:12px;right:16px}
  header{flex-direction:column;gap:12px;align-items:flex-start;padding-top:14px}
  nav button{padding:8px 11px;font-size:12px}
  .page{padding-top:130px}
  .dots{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-delay:0s!important}
}

<script>
/* ---------- Embedding space background ---------- */
(function(){
  const c=document.getElementById('bg'),x=c.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const mobile=innerWidth<700;
  const names=['home','projects','skills','contact'];
  const cl=[
    {c:[-1.3,.2,0],k:'61,230,196'},
    {c:[1.2,-.4,.5],k:'155,123,255'},
    {c:[.1,1.1,-.9],k:'79,155,255'},
    {c:[0,-1,-.6],k:'240,153,123'}
  ];
  const per=mobile?32:62, thr=mobile?.34:.3;
  const g=()=>(Math.random()+Math.random()+Math.random()-1.5)/1.5;
  const P=[],LK=cl.map(()=>[]);
  cl.forEach((q,k)=>{
    const s=P.length;
    for(let i=0;i<per;i++)P.push({k,p:[q.c[0]+g()*.55,q.c[1]+g()*.55,q.c[2]+g()*.55],r:Math.random()*.7+.8});
    for(let i=s;i<P.length;i++)for(let j=i+1;j<P.length;j++){
      const a=P[i].p,b=P[j].p;
      if(Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2])<thr)LK[k].push([i,j]);
    }
  });
  let w,h,dpr,cx,cy,focus=0,boost=0,ang=0,mx=.5;
  const cam={x:cl[0].c[0],y:cl[0].c[1],z:cl[0].c[2],s:1.9};
  function size(){
    dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;
    c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px';
    x.setTransform(dpr,0,0,dpr,0,0);
    cx=w>800?w*.68:w/2;cy=h/2;
  }
  addEventListener('resize',()=>{size();if(reduce)frame()});
  addEventListener('pointermove',e=>{mx=e.clientX/innerWidth});
  size();

  function frame(){
    ang+=.0035+boost*.03;boost*=.94;
    const t=cl[focus],ts=1.9;
    cam.x+=(t.c[0]-cam.x)*.05;cam.y+=(t.c[1]-cam.y)*.05;cam.z+=(t.c[2]-cam.z)*.05;cam.s+=(ts-cam.s)*.05;
    const a=ang+(mx-.5)*.5,ca=Math.cos(a),sa=Math.sin(a);
    const sc=Math.min(w,h)*.26*(cam.s-boost*.5);
    const pr=p=>{
      const X=p[0]-cam.x,Y=p[1]-cam.y,Z=p[2]-cam.z;
      const xr=X*ca+Z*sa,zr=-X*sa+Z*ca,k=3/(3+zr);
      return{x:cx+xr*k*sc,y:cy+Y*k*sc,k};
    };
    x.clearRect(0,0,w,h);
    const Q=P.map(o=>pr(o.p));
    for(let k=0;k<cl.length;k++){
      const dim=k===focus?1:.18;
      x.strokeStyle='rgba('+cl[k].k+','+(.26*dim)+')';x.lineWidth=.7;
      x.beginPath();
      for(const l of LK[k]){const p=Q[l[0]],q=Q[l[1]];x.moveTo(p.x,p.y);x.lineTo(q.x,q.y)}
      x.stroke();
    }
    for(let i=0;i<P.length;i++){
      const o=P[i],q=Q[i],dim=o.k===focus?1:.22;
      x.fillStyle='rgba('+cl[o.k].k+','+(.9*dim)+')';
      x.beginPath();x.arc(q.x,q.y,o.r*1.5*q.k*Math.sqrt(cam.s),0,6.283);x.fill();
    }
    x.font='12px "JetBrains Mono",monospace';x.textAlign='center';
    for(let k=0;k<cl.length;k++){
      const q=cl[k],p=pr([q.c[0],q.c[1]-.7,q.c[2]]);
      x.fillStyle='rgba(232,236,255,'+(k===focus?.8:.22)+')';
      x.fillText('# '+names[k],p.x,p.y);
    }
    if(!reduce)requestAnimationFrame(frame);
  }
  window.__focus=function(n){
    focus=n;boost=1;
    if(reduce){const t=cl[n];cam.x=t.c[0];cam.y=t.c[1];cam.z=t.c[2];frame()}
  };
  frame();
})();

/* ---------- Cursor glow ---------- */
(function(){
  const g=document.getElementById('glow');
  if(matchMedia('(pointer:coarse)').matches){g.style.opacity='.6';return}
  addEventListener('pointermove',e=>{g.style.left=e.clientX+'px';g.style.top=e.clientY+'px'});
})();

/* ---------- Navigation ---------- */
(function(){
  const pages=[...document.querySelectorAll('.page')];
  const btns=[...document.querySelectorAll('nav button')];
  const dots=[...document.querySelectorAll('#dots i')];
  const pill=document.getElementById('pill');
  const wipe=document.getElementById('wipe');
  const counter=document.getElementById('counter');
  let cur=0,lock=false;

  function movePill(){
    const b=btns[cur];
    pill.style.width=b.offsetWidth+'px';
    pill.style.transform='translateX('+b.offsetLeft+'px)';
  }
  function go(n){
    if(lock||n===cur||n<0||n>=pages.length)return;
    lock=true;
    const dir=n>cur?1:-1;
    pages.forEach(p=>p.style.setProperty('--dir',dir));
    const old=pages[cur];
    old.classList.add('leaving');old.classList.remove('active');
    wipe.classList.remove('run','back');void wipe.offsetWidth;
    wipe.classList.add(dir>0?'run':'back');
    cur=n;
    window.__focus&&window.__focus(cur);
    pages[cur].classList.remove('leaving');pages[cur].classList.add('active');
    pages[cur].scrollTop=0;
    btns.forEach((b,i)=>b.classList.toggle('active',i===cur));
    dots.forEach((d,i)=>d.classList.toggle('active',i===cur));
    counter.innerHTML='<b>0'+(cur+1)+'</b> / 0'+pages.length;
    movePill();
    setTimeout(()=>{old.classList.remove('leaving');lock=false},900);
  }
  btns.forEach((b,i)=>b.addEventListener('click',()=>go(i)));
  dots.forEach((d,i)=>d.addEventListener('click',()=>go(i)));
  document.querySelectorAll('.btn[data-go]').forEach(b=>b.addEventListener('click',()=>go(+b.dataset.go)));
  addEventListener('keydown',e=>{
    if(['ArrowRight','ArrowDown','PageDown'].includes(e.key))go(cur+1);
    if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key))go(cur-1);
  });
  let wheelT=0;
  addEventListener('wheel',e=>{
    const p=pages[cur];
    const canScroll=p.scrollHeight>p.clientHeight+4;
    if(canScroll&&((e.deltaY>0&&p.scrollTop+p.clientHeight<p.scrollHeight-2)||(e.deltaY<0&&p.scrollTop>0)))return;
    const now=Date.now();if(now-wheelT<1100||Math.abs(e.deltaY)<20)return;
    wheelT=now;go(cur+(e.deltaY>0?1:-1));
  },{passive:true});
  let sx=0,sy=0;
  addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
  addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.3)go(cur+(dx<0?1:-1));
  },{passive:true});
  addEventListener('resize',movePill);
  document.fonts&&document.fonts.ready.then(movePill);
  movePill();
  window.__movePill=movePill;
})();
